name: Cross-Browser CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Install and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type-check
        run: npm run typecheck

      - name: Run unit and integration quality gates
        env:
          BASE_URL: https://testautomationpractice.blogspot.com/
          EXPECTED_TITLE: Automation Testing Practice
          INTEGRATION_TIMEOUT_MS: 30000
        run: npm run test:ci:quality-gates

  cucumber:
    name: Cucumber / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} with system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Cucumber tests with one worker
        env:
          HEADLESS: true
        run: npm run test:ci:cucumber -- ${{ matrix.browser }}

      - name: Upload Cucumber artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-${{ matrix.browser }}
          path: |
            test-results/cucumber-report-${{ matrix.browser }}.html
            test-results/screenshots/**/*.png
            test-results/videos/**/*.webm
          if-no-files-found: ignore
          retention-days: 14

  playwright:
    name: Playwright / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }} with system dependencies
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests with one worker
        env:
          HEADLESS: true
        run: npm run test:ci:playwright -- ${{ matrix.browser }}

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
