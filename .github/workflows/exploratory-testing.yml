name: Exploratory Testing

on:
  schedule:
    - cron: "0 4 * * 6"
  workflow_dispatch:
    inputs:
      url:
        description: Target website URL
        required: false
        default: https://testautomationpractice.blogspot.com/
      browser:
        description: Browser for bounded exploration
        required: true
        default: chromium
        type: choice
        options:
          - chromium
          - firefox
          - webkit
      max_pages:
        description: Maximum pages to visit
        required: false
        default: "10"
      max_actions:
        description: Maximum safe actions to attempt
        required: false
        default: "20"
      authorize_destructive:
        description: Explicitly authorize destructive actions
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  explore:
    name: Bounded exploratory browser session
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser with system dependencies
        run: npx playwright install --with-deps ${{ inputs.browser || 'chromium' }}

      - name: Run bounded exploratory session
        env:
          BROWSER: ${{ inputs.browser || 'chromium' }}
        run: |
          AUTHORIZATION=""
          if [ "${{ inputs.authorize_destructive }}" = "true" ]; then
            AUTHORIZATION="--authorize-destructive"
          fi
          npm run test:exploratory -- \
            --url "${{ inputs.url || 'https://testautomationpractice.blogspot.com/' }}" \
            --browser "$BROWSER" \
            --max-pages "${{ inputs.max_pages || '10' }}" \
            --max-actions "${{ inputs.max_actions || '20' }}" \
            $AUTHORIZATION

      - name: Add exploratory summary
        if: always()
        run: |
          if [ -f test-results/exploratory/exploratory.md ]; then
            cat test-results/exploratory/exploratory.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload exploratory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exploratory-testing-${{ inputs.browser || 'chromium' }}
          path: |
            test-results/exploratory/
          if-no-files-found: ignore
          retention-days: 30
